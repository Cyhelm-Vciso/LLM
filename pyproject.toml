[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberllm"
version = "0.1.0"
description = "Build datasets, fine-tune, and evaluate AI models as a CISO, cybersecurity expert, or cybersecurity engineer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "transformers>=4.46",
  "datasets>=2.20",
  "peft>=0.13",
  "trl>=0.19",
  "accelerate>=0.34",
  "bitsandbytes>=0.43; platform_system == 'Linux'",
]
claude = ["anthropic>=2.5"]
dev = ["pytest>=8"]

[project.scripts]
cyberllm = "cyberllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyberllm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
